<style>
/* Layout: uma coluna de controles em cima, cards em grade de 2 embaixo (celular primeiro) */
:root {
  --bg: #f6f3ee; --painel: #ffffff; --linha: #e4ddd2; --txt: #1d1a16; --mut: #786f63;
  --acc: #ff6b2c; --acc2: #ffb347; --ok: #2f8f4e;
  --f-ui: "Inter", system-ui, sans-serif; --f-marca: "Instrument Serif", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14131a; --painel: #1d1c25; --linha: #2e2c38; --txt: #eeeaf2; --mut: #9a96a8; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #14131a; --painel: #1d1c25; --linha: #2e2c38; --txt: #eeeaf2; --mut: #9a96a8; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--txt); font: 15px/1.45 var(--f-ui); padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; gap: 10px; }
header img { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--acc), var(--acc2)); padding: 5px; }
header h1 { font: 400 30px/1 var(--f-marca); margin: 0; }
header small { display: block; color: var(--mut); font-size: 12px; }
details { background: var(--painel); border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; }
summary { font-weight: 700; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mut); min-width: 0; }
label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--txt); font-size: 14px; }
input, select, textarea, button { font: inherit; color: var(--txt); background: var(--bg); border: 1px solid var(--linha); border-radius: 10px; padding: 10px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
button { cursor: pointer; font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
.primario { background: linear-gradient(135deg, var(--acc), var(--acc2)); border: 0; color: #1a0f05; font-weight: 800; padding: 14px; font-size: 16px; }
.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.barra .grow { flex: 1; }
#status { color: var(--mut); font-size: 13px; }
#cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
#cards canvas { width: 100%; display: block; border-radius: 10px; border: 1px solid var(--linha); cursor: zoom-in; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); z-index: 20; }
#zoom img { max-width: 100%; max-height: 78vh; border-radius: 8px; }
#zoom .barra { justify-content: center; }
@media (prefers-reduced-motion: no-preference) { #cards canvas { transition: transform .15s; } #cards canvas:active { transform: scale(.98); } }
</style>

      <label>Estilo <select id="estilo"></select></label>

  // Títulos de capa que funcionam em qualquer tom (estilo das capas virais)
  const CAPAS_GERAIS = ['Frases difíceis de engolir', 'Frases curtas porém profundas', 'As melhores frases para sua situação atual:', 'Frases que eu queria ter lido antes', 'Leia isso antes de dormir', 'Verdades que ninguém te conta', 'Frases pra quem está cansado de tudo', 'Isso é pra você que está passando por algo', 'Frases que doem, mas libertam', 'Salve para ler quando precisar', 'Frases que parecem indiretas, mas são verdades', 'Coisas que aprendi tarde demais'];
  const CAPAS = {
    indireta: ['Indiretas *bem diretas*', 'Essas merecem ir para o status…', 'Coloque isso no seu status e suma…', 'Poste isso nos status'],
    reflexao: ['Frases que vão te fazer *pensar*', 'Leia com calma…', 'Tem peito pra ler essa…?'],
    humor: ['Frases pra rir e *mandar no grupo*', 'Só quem é vai entender…'],
    fe: ['Mensagens pra *fortalecer* sua fé', 'Deus te mandou ler isso hoje…'],
    autoestima: ['Frases curtas que vão te fazer *se amar*', 'Leia isso se você anda esquecendo seu valor…'],
    compartilhar: ['Envie pra quem *você ama*', 'Frases pra mandar pro seu melhor amigo'],
    disciplina: ['Frases pra quem quer *evoluir*', 'Leia antes de desistir'],
  };
  // Último card do post, escolhido no app (padrão: seguir)
  const CTAS_POR_TIPO = {
    seguir: ['Vai por mim, esse perfil nunca mais vai aparecer pra você de novo, então *segue aí*.', 'Se você chegou até aqui, *segue* pra ver mais frases assim.', 'Segue a página: amanhã tem mais *verdade* pra você.'],
    salvar: ['Salva pra ler de novo quando *precisar*.', 'Salva esse post: um dia você vai *precisar* dele.'],
    comentar: ['Qual dessas é a *sua*? Comenta aqui.', 'Comenta "eu" se alguma dessas foi *pra você*.'],
    compartilhar: ['Manda pra quem precisa *ler isso* hoje.', 'Compartilha no seu status e *some*.'],
  };
  const CTAS = CTAS_POR_TIPO.seguir.concat(CTAS_POR_TIPO.salvar);
  const LEGENDAS = {
    indireta: ['Quem entendeu, entendeu 👀', 'Mandei indireta? Não, mandei direta mesmo.'],
    reflexao: ['Leia com calma e guarde no coração.', 'Para e pensa nisso hoje.'],
    humor: ['Marca aquele amigo que é assim 😂', 'Eu e você? Igualzinho.'],
    fe: ['Amém? 🙏', 'Deixa um amém se você recebe.'],
    autoestima: ['Lembrete diário do seu valor ✨', 'Releia sempre que esquecer.'],
    compartilhar: ['Envie pra essa pessoa agora 💌', 'Marca quem merece ler isso.'],
    disciplina: ['Comece hoje. Evolua todo dia.', 'Sem desculpa: só constância.'],
  };
  const HASHTAGS = '#frases #reflexão #motivação #status'; // + a hashtag da própria página (vem do @)

  // rnd(): 0..1, injetável nos testes
  const pick = (arr, rnd) => arr[Math.floor(rnd() * arr.length)];

  function preencher(molde, slots, rnd) {
    const pares = {}, usados = new Set();
    return molde.replace(/\{(\w+)(?:\.(\d))?\}/g, (_, nome, i) => {
      const lista = slots[nome];
      if (!lista) throw new Error('slot sem lista: ' + nome);
      if (i == null) { // não repete o mesmo valor na frase ("em não responder, em não responder")
        let v; for (let k = 0; k < 10 && (v === undefined || usados.has(v)); k++) v = pick(lista, rnd);
        usados.add(v); return v;
      }
      pares[nome] = pares[nome] || pick(lista, rnd); // {par.0} e {par.1} usam o mesmo par
      return pares[nome][i];
    });
  }

  function gerarFrase(tom, rnd = Math.random, usadas = new Set()) {
    const t = TONS[tom];
    // o mesmo molde ("Nasci em ...") só volta depois de passar pelos outros: compara o começo da frase
    const comeco = (f) => 'c:' + f.replace(/[^\p{L} ]/gu, '').toLowerCase().split(' ').slice(0, 2).join(' ');
    for (let k = 0; k < 40; k++) {
      const f = preencher(pick(t.frases, rnd), t.slots, rnd);
      if (!usadas.has(f) && !usadas.has(comeco(f))) { usadas.add(f); usadas.add(comeco(f)); return f; }
    }
    return preencher(pick(t.frases, rnd), t.slots, rnd); // banco esgotado: aceita repetida
  }

  // tipo: 'soltas' | 'carrossel'. Retorna lista de textos (um por card).
  // prontas: frases já criadas pela IA; o que faltar vem do banco.
  // ctaTipo: seguir | salvar | comentar | compartilhar | nenhum
  // Frase "de mês" ("Nasci em junho, por isso...") só faz sentido num carrossel de meses inteiro
  const MES_RE = /\bnasc\w*\s+(em|no m[eê]s de)\s+\*?(janeiro|fevereiro|mar[cç]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)/i;

  // Juiz (a "disputa" do Cut Prime): gera mais candidatas do que o pedido, a IA dá nota a cada uma e ficam as melhores.
  function montarJuiz(cands, tom, tema) {
    return ['Você é editor-chefe de uma página brasileira de frases no Instagram que quer viralizar.',
      `Avalie cada frase candidata para um carrossel${tema ? ` sobre "${tema}"` : ''}${TONS[tom] ? ` (tom ${TONS[tom].nome.toLowerCase()})` : ''}.`,
      'Nota 0 a 10: 10 = frase completa, faz sentido sozinha, forte, dá vontade de salvar/compartilhar; 0 = sem sentido, cortada, clichê vazio, erro de português, ou repete a ideia de outra da lista. Se foi pedido um assunto e a frase não fala dele, nota 0.',
      'Responda SÓ uma linha por frase, exatamente: número|nota', '',
      ...cands.map((c, i) => `${i + 1}. ${c.replace(/\*/g, '')}`)].join('\n');
  }
  // devolve as candidatas da melhor pra pior, sem as de nota < minimo
  function lerJuiz(txt, cands, minimo = 6) {
    const nota = new Map();
    for (const l of txt.split('\n')) { const m = l.match(/^\s*(\d+)\s*[.):|-]\s*(\d{1,2})(?!\d)/); /* aceita "2|9" e "2. 9|motivo" */ if (m && cands[+m[1] - 1] != null) nota.set(+m[1] - 1, +m[2]); }
    return [...nota].filter(([, n]) => n >= minimo).sort((a, b) => b[1] - a[1]).map(([i]) => cands[i]);
  }

  // Todo post termina com CTA (menos "nenhum"). ctaLugar: 'extra' = card a mais | 'ultimo' = ocupa o último card
  function gerarLote({ tom, tipo = 'soltas', qtd = 5, capa, cta = true, ctaTipo = 'seguir', ctaLugar = 'extra', prontas = [], permitirMes = false, tema = '' }, rnd = Math.random, usadas = new Set()) {
    const tons = tom === 'misturar' ? Object.keys(TONS) : [tom];
    // Nunca repete dentro do lote: compara sem acento/pontuação; se o tom acabar, puxa dos outros tons e da base
    const chave = (f) => f.normalize('NFD').replace(/[^a-z ]/gi, '').toLowerCase().replace(/\s+/g, ' ').trim();
    const vistas = new Set(), cards = [];
    const por = (f) => { const k = chave(f); if (f && !vistas.has(k) && (permitirMes || !MES_RE.test(f))) { vistas.add(k); cards.push(f); } };
    prontas.filter((f) => !usadas.has(f)).slice(0, qtd).forEach(por);
    // Nunca repete entre gerações: o que já saiu (usadas) não volta. Banco do tom acabou → outros tons → base de virais.
    const todos = Object.keys(TONS), antes = new Set(usadas);
    // Com assunto digitado: só completa com frases que falam do assunto (nunca enche com frase aleatória)
    const temaPal = tema ? [...palavras(tema)] : null;
    const casaTema = (f) => !temaPal || [...palavras(f)].some((w) => temaPal.some((k) => w.startsWith(k.slice(0, 5))));
    const extra = Object.values(BASE.frases).flat().filter((f) => !antes.has(f) && casaTema(f));
    for (let i = 0; cards.length < qtd && i < qtd * 30; i++) {
      const lista = i < qtd * 8 ? tons : todos;
      let f = !temaPal && i < qtd * 14 ? gerarFrase(lista[i % lista.length], rnd, usadas) : null;
      if ((!f || antes.has(f)) && extra.length) f = extra.splice(Math.floor(rnd() * extra.length), 1)[0];
      if (f && !antes.has(f)) { por(f); usadas.add(f); }
    }
    if (tipo === 'carrossel') cards.unshift(capa || pick(CAPAS[tons[0]].concat(CAPAS_GERAIS), rnd));
    if (cta && CTAS_POR_TIPO[ctaTipo]) {
      if (ctaLugar === 'ultimo' && cards.length > 1) cards.pop();
      cards.push(pick(CTAS_POR_TIPO[ctaTipo], rnd));
    }
    return cards;
  }

  function gerarLegenda(tom, arroba, rnd = Math.random) {
    const t = TONS[tom] ? tom : pick(Object.keys(TONS), rnd);
    return `${pick(LEGENDAS[t], rnd)}\n\nSalva pra ler depois e manda pra quem precisa ✨\nSiga ${arroba || ''} pra mais frases.\n\n${HASHTAGS}${arroba ? ' #' + arroba.replace(/^@/, '') : ''}`;
  }

  // Lote colado: frases separadas por uma linha com ---
  const dividirLote = (txt) => txt.split(/^\s*-{3,}\s*$/m).map((s) => s.trim()).filter(Boolean);

  const MESES_DA_SERIE = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  const REFLEXOES_DA_SERIE = [
    'Você pode recomeçar antes de ter todas as respostas.',
    'Você pode gostar de alguém e ainda assim precisar de espaço.',
    'Você não precisa esperar perder a paciência pra dizer o que incomoda.',
    'Seu esforço também conta nos dias em que ninguém percebe.',
    'Cuidar de quem você ama não exige esquecer de si.',
    'Se você só descansa quando termina tudo, sempre sobra mais alguma coisa.',
    'Às vezes, amadurecer é parar de insistir numa conversa que sempre termina do mesmo jeito.',
    'Você não precisa responder na hora só porque alguém fez uma pergunta difícil.',
    'Até uma escolha certa pode dar saudade do que ficou pra trás.',
    'Quem se acostumou com o seu silêncio pode estranhar quando você começar a se posicionar.',
    'Você já mudou de ideia antes. Pode mudar de caminho também.',
    'Antes de cobrar tudo que faltou, lembre do que você precisou atravessar pra chegar aqui.',
  ];
  const normalizarTema = (texto) => texto.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  function serieDeMeses(tema) {
    const texto = normalizarTema(tema);
    return /\b(seu mes|mes (de nascimento|que voce nasceu)|mes em que|cada mes|12 meses|doze meses|meses do ano)\b/.test(texto);
  }

  const pedidoParaMarcar = (tema) => /\b(marc[ae]r?|marque|marquem|marcando)\b/.test(normalizarTema(tema));

  function montarPedidoTematico({ tema, tom, tipo, qtd, capa }, refazer = false) {
    const carrossel = tipo === 'carrossel';
    const meses = serieDeMeses(tema);
    return [
      `Pedido do usuário: ${tema}`,
      meses ? `Escreva uma reflexão concreta para quem nasceu em cada mês, em ordem: ${MESES_DA_SERIE.join(', ')}. Comece cada frase com o nome do mês seguido de dois-pontos.` :
        `Escreva ${qtd} frases sobre esse mesmo pedido. Se houver uma série ou lista implícita, siga o mesmo formato em todos os itens. Se o pedido for para marcar alguém, escreva chamadas para marcar alguém em todos os itens. Nas demais séries, deixe a chamada de ação fora do corpo.`,
      pedidoParaMarcar(tema) && !meses ? 'Comece cada frase com Marca ou Marque e especifique quem a pessoa deve marcar.' : '',
      carrossel ? 'Faça um carrossel coeso: cada frase precisa cumprir a promessa da capa e trazer uma ideia diferente.' : 'Cada frase deve fazer sentido sozinha e ser reconhecível como parte do mesmo tema.',
      capa && carrossel ? `A capa escolhida foi “${capa}”. Use-a apenas se combinar com o pedido.` : '',
      carrossel ? 'Na primeira linha, escreva CAPA: seguida de um título curto e específico para o tema.' : '',
      `Depois escreva somente as ${meses ? 12 : qtd} frases, uma por linha, sem numeração. Use português brasileiro natural, frases completas de 8 a 30 palavras, sem hashtags. Tom: ${TONS[tom]?.nome || 'natural e variado'}.`,
      refazer ? 'Refaça o lote completo. Confira a quantidade, a estrutura e se cada frase cumpre o pedido antes de responder.' : '',
    ].filter(Boolean).join('\n');
  }

  function lerPedidoTematico(resposta, { tema, tipo, qtd }) {
    const linhas = resposta.trim().split(/\r?\n/);
    const indice = linhas.findIndex((linha) => /^\s*CAPA\s*:/i.test(linha));
    const capa = indice < 0 ? '' : linhas.splice(indice, 1)[0].replace(/^\s*CAPA\s*:\s*/i, '').trim();
    if (serieDeMeses(tema)) {
      const frases = MESES_DA_SERIE.map((mes) => {
        const prefixo = new RegExp(`^\\s*${mes}\\s*:\\s*`, 'i');
        const linha = linhas.find((texto) => prefixo.test(texto));
        return linha && limparResposta(linha.replace(prefixo, ''), 1)[0];
      });
      const normalizadas = frases.filter(Boolean).map((frase) => normalizarTema(frase.replace(/\*/g, '')));
      if (normalizadas.length !== 12 || new Set(normalizadas).size !== 12) return null;
      return { capa: 'Seu mês, uma reflexão', frases: MESES_DA_SERIE.map((mes, i) => `${mes}\n${frases[i]}`) };
    }
    const frases = limparResposta(linhas.join('\n'), qtd);
    if (frases.length !== qtd || (tipo === 'carrossel' && !capa)) return null;
    if (pedidoParaMarcar(tema) && frases.some((frase) => !/^(marca|marque)\b/i.test(frase.replace(/\*/g, '')))) return null;
    return { capa, frases };
  }

  function loteDeMeses() {
    return { capa: 'Seu mês, uma reflexão', frases: MESES_DA_SERIE.map((mes, i) => `${mes}\n${REFLEXOES_DA_SERIE[i]}`) };
  }

  // ---- IA local sem tema: usa exemplos do banco ----
  // curtidas/rejeitadas: [{texto, tom}] vindas do 👍/👎. As curtidas viram os primeiros exemplos.
  // Base grande de frases (src/base.json, por tom). Escolhe as que mais combinam com o tema.
  const BASE = { frases: {} };
  // base.json (criada pela IA local) + virais.json (frases populares de status), por tom
  function juntarBase(...fontes) {
    BASE.frases = {};
    for (const f of fontes) for (const [tom, l] of Object.entries(f)) if (Array.isArray(l)) BASE.frases[tom] = (BASE.frases[tom] || []).concat(l);
  }
  const palavras = (t) => new Set(t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').match(/[a-z]{4,}/g) || []);
  function exemplosDaBase(tom, tema, n, rnd = Math.random) {
    const lista = TONS[tom] ? BASE.frases[tom] || [] : Object.values(BASE.frases).flat();
    const chave = palavras(tema || '');
    const nota = (f) => [...palavras(f)].filter((w) => [...chave].some((k) => w.startsWith(k.slice(0, 5)))).length + rnd() * 0.5;
    return lista.map((f) => [nota(f), f]).sort((a, b) => b[0] - a[0]).slice(0, n).map((x) => x[1]);
  }

  // recentes: frases dos últimos lotes; a IA é proibida de repetir ou parafrasear
  function montarPrompt({ tom, tema, qtd, curtidas = [], rejeitadas = [], recentes = [] }, rnd = Math.random) {
    const tons = TONS[tom] ? [tom] : Object.keys(TONS);
    const doTom = (l) => l.filter((c) => !TONS[tom] || c.tom === tom).map((c) => c.texto.replace(/\n/g, ' '));
    const exemplos = new Set([...doTom(curtidas).sort(() => rnd() - 0.5).slice(0, 10), ...exemplosDaBase(tom, tema, 14, rnd)]);
    for (let i = 0; exemplos.size < 12 && i < 60; i++) exemplos.add(gerarFrase(tons[i % tons.length], rnd, new Set()).replace(/\n/g, ' '));
    const nomeTom = TONS[tom] ? TONS[tom].nome.toLowerCase() : 'variado';
    return [
      'Você escreve frases curtas para posts de uma página brasileira de frases no Instagram.',
      `Copie o jeito destes exemplos (tom ${nomeTom}): mesmo tamanho, mesma linguagem do dia a dia, mesmo ritmo.`,
      ...[...exemplos].map((e) => '- ' + e),
      '',
      'Regras: português do Brasil; 8 a 30 palavras; primeira pessoa ("eu") ou conselho direto; frases que dá vontade de postar no status;',
      'sem hashtag, sem emoji, sem numeração, sem explicar nada; marque de 1 a 3 palavras fortes com *asteriscos*.',
      ...(doTom(rejeitadas).length ? ['Não escreva frases parecidas com estas (o dono da página não gostou):', ...doTom(rejeitadas).slice(-4).map((e) => '- ' + e)] : []),
      ...(recentes.length ? ['Já foram usadas (NÃO repita nem escreva parecido, nem o mesmo começo):', ...recentes.slice(-20).map((e) => '- ' + e)] : []),
      tema ? `Tema: ${tema}.` : '',
      `Escreva ${qtd} frases NOVAS (não repita os exemplos), uma por linha.`,
    ].filter((l) => l !== '').join('\n');
  }

  // Resposta da IA -> lista de frases limpas

    status(lista.length ? `${lista.length} cards prontos. Toque num card pra ver em tamanho real.` : 'Gere um post pra começar.');
    $('baixarTudo').textContent = lista.length ? `⬇ Baixar as ${lista.length} imagens` : '⬇ Baixar todas as imagens';
    gravar();
  }, 150);
}
['formato', 'fishEye', 'escala', 'logoPos', 'usarFundos'].forEach((k) => { $(k).oninput = desenharTudo; });
$('texto').oninput = desenharTudo;
$('legenda').oninput = gravar;

let sample = null;
usar('sample').then((s) => { sample = s; if (!s) { $('usarIA').checked = false; $('usarIA').disabled = true; $('usarIA').parentElement.title = 'IA indisponível aqui'; } });

function misturarVirais(prontas, tom, tema, qtd) {
  if (!$('misturar').checked) return prontas;
  const n = Math.ceil(qtd / 2);
  const virais = Frases.exemplosDaBase(tom, tema, n * 6, Math.random).filter((f) => !usadas.has(f)).slice(0, n);
  const out = [];
  for (let i = 0; out.length < qtd && (i < virais.length || i < prontas.length); i++) {
    if (virais[i]) out.push(virais[i]);
    if (prontas[i] && out.length < qtd) out.push(prontas[i]);
  }
  return out;
}

$('gerar').onclick = async () => {
  const tom = $('tom').value, tema = $('tema').value.trim(), qtd = Math.min(20, +$('qtd').value || 6);
  const btn = $('gerar'); btn.disabled = true;
  let prontas = [], julgado = false;
  if ($('usarIA').checked && sample) {
    btn.textContent = '⚡ Criando com IA…';
    try {
      const pedido = Frases.montarPrompt({ tom, tema, qtd, curtidas: Frases.exemplosDaBase(tom, tema, 10, Math.random).map((texto) => ({ texto, tom })), recentes: [...usadas].filter((f) => !f.startsWith('c:')) });
      // disputa: a IA cria o dobro, entram virais reais, a IA julga e ficam as melhores
      const criadas = Frases.limparResposta((await sample(pedido.replace(`Escreva ${qtd} frases`, `Escreva ${qtd * 2} frases`), { modelTier: 'quick' })).text, qtd * 2);
      const virais = $('misturar').checked ? Frases.exemplosDaBase(tom, tema, qtd * 3, Math.random).filter((f) => !usadas.has(f)).slice(0, qtd) : [];
      const cands = [...criadas, ...virais].filter((f) => !Frases.MES_RE.test(f));
      btn.textContent = '⚡ Escolhendo as melhores…';
      prontas = Frases.lerJuiz((await sample(Frases.montarJuiz(cands, tom, tema), { modelTier: 'quick' })).text, cands).slice(0, qtd);
      julgado = prontas.length > 0;
    } catch (e) { status(e.code === 'not_granted' ? 'IA não liberada: usei as frases virais e o banco.' : 'A IA não respondeu agora: usei as frases virais e o banco.'); }
  }
  const lote = Frases.gerarLote({ tom, tipo: $('tipo').value, qtd, capa: $('capa').value, ctaTipo: $('ctaTipo').value, ctaLugar: $('ctaLugar').value, tema, prontas: julgado ? prontas : misturarVirais(prontas, tom, tema, qtd) }, Math.random, usadas);
  lote.forEach((f) => usadas.add(f));
  $('texto').value = lote.join('\n---\n');
  $('legenda').value = Frases.gerarLegenda(tom, perfil().arroba);
  btn.disabled = false; btn.textContent = '⚡ Gerar post';
  desenharTudo();
};

let downloads = null;
usar('downloads').then((d) => { downloads = d; }); // no Claude: confirmação do Claude; fora dele: compartilhar/baixar do navegador
// Um canvas só, reaproveitado e liberado: no celular, muitos canvas grandes ao mesmo tempo fazem o navegador baixar a qualidade
const telaExport = document.createElement('canvas');
const pngDe = (texto, i = 0) => new Promise((ok) => desenhar(telaExport, texto, true, i).toBlob((b) => { telaExport.width = telaExport.height = 1; ok(b); }, 'image/png'));
// Fora do Claude: abre o "compartilhar" do celular (salvar na galeria, Instagram...) ou baixa direto
async function compartilhar(arquivos, texto) {
  if (navigator.canShare?.({ files: arquivos })) {
    try { await navigator.share({ files: arquivos, text: texto }); status('Pronto!'); return true; }
    catch (e) { if (e.name === 'AbortError') { status('Cancelado.'); return true; } }
  }
  return false;
}
function baixarDireto(filename, data) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(data); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  status(`Baixado: ${filename}`);
}
async function salvar(filename, data) {
  if (!downloads) { if (!(await compartilhar([new File([data], filename, { type: data.type })]))) baixarDireto(filename, data); return; }
  try { await downloads.save({ filename, data }); status(`Salvo: ${filename}`); }
  catch (e) { status(e.code === 'declined' ? 'Download cancelado.' : e.code === 'rate_limited' ? 'Espere a confirmação anterior e tente de novo.' : 'Não deu pra salvar agora.'); }
}
// Canva: abre o "compartilhar" do celular com todas as imagens em ordem; é só escolher o app do Canva na lista
$('canvaCel').onclick = async () => {
  const lista = cards(); if (!lista.length) return status('Gere um post primeiro.');
  status('Montando as imagens…');
  const pngs = [];
  for (let i = 0; i < lista.length; i++) pngs.push(new File([await pngDe(lista[i], i)], String(i + 1).padStart(2, '0') + '.png', { type: 'image/png' }));
  if (await compartilhar(pngs, $('legenda').value)) return status('Escolha o Canva na lista. As imagens vão na ordem certa.');
  for (const f of pngs) { if (downloads) await salvar(f.name, f); else { baixarDireto(f.name, f); await new Promise((r) => setTimeout(r, 700)); } }
  status('Imagens salvas. Abra o Canva e envie as imagens da galeria (já estão em ordem).');
};
$('baixarTudo').onclick = async () => {
  const lista = cards(); if (!lista.length) return status('Gere um post primeiro.');
  status('Montando os cards em tamanho real…');
  const pngs = [];
  for (let i = 0; i < lista.length; i++) pngs.push(new File([await pngDe(lista[i], i)], String(i + 1).padStart(2, '0') + '.png', { type: 'image/png' }));
  if (!downloads && (await compartilhar(pngs, $('legenda').value))) return; // celular: manda os cards em ordem pra galeria/Instagram
  // Sem zip: cada card sai solto, em ordem (01, 02, 03...)
  for (const f of pngs) {
    if (downloads) await salvar(f.name, f);
    else { baixarDireto(f.name, f); await new Promise((r) => setTimeout(r, 700)); }
  }
  status(`${pngs.length} cards salvos em ordem.`);
};
let zoomIdx = 0;
async function abrirZoom(i) {
  zoomIdx = i; $('zoom').hidden = false;
  $('zoomImg').src = URL.createObjectURL(await pngDe(cards()[i], i));
}
$('zoomFechar').onclick = () => { $('zoom').hidden = true; };
$('zoomBaixar').onclick = async () => salvar(String(zoomIdx + 1).padStart(2, '0') + '.png', await pngDe(cards()[zoomIdx], zoomIdx));
$('copiar').onclick = () => { navigator.clipboard.writeText($('legenda').value).then(() => status('Legenda copiada.'), () => { $('legenda').select(); status('Selecione e copie a legenda.'); }); };

function mostrarPerfil() {
  opt($('perfil'), perfis.lista.map((x) => [x.id, x.nome || 'Sem nome']));
  const p = perfil(); $('perfil').value = p.id;
  $('pNome').value = p.nome; $('arroba').value = p.arroba; $('perfilNome').textContent = p.nome + (p.arroba ? ' · ' + p.arroba : '');
  $('pLogoPrev').hidden = !p.logo; if (p.logo) $('pLogoPrev').src = p.logo;
  $('pLogoPrev').style.opacity = p.semLogo ? 0.3 : 1; $('pSemLogo').textContent = p.semLogo ? 'Usar logo' : 'Sem logo'; $('pSemLogo').hidden = !p.logo;
  if (p.logo) { LOGO.onload = desenharTudo; LOGO.src = p.logo; } else desenharTudo();
  if (!p.arroba) $('perfilBox').open = true; // primeira vez: mostra pra pessoa preencher
}
$('perfil').onchange = () => { perfis.atual = $('perfil').value; guardarPerfis(); mostrarPerfil(); };
$('pNome').oninput = () => { perfil().nome = $('pNome').value; guardarPerfis(); $('perfil').selectedOptions[0].textContent = perfil().nome || 'Sem nome'; };
$('arroba').oninput = () => { let v = $('arroba').value.trim(); if (v && !v.startsWith('@')) v = '@' + v; perfil().arroba = v; guardarPerfis(); desenharTudo(); };
$('arroba').onchange = () => { $('arroba').value = perfil().arroba; mostrarPerfil(); };
$('pLogo').onchange = () => {
  const f = $('pLogo').files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { // reduz pra caber no armazenamento do navegador (logo aparece pequena no post)
    const k = Math.min(1, 600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    perfil().logo = c.toDataURL('image/png'); perfil().semLogo = false; guardarPerfis(); mostrarPerfil(); URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};
// "Sem logo" só desliga a logo nos posts; a imagem continua guardada pra ligar de novo
$('pSemLogo').onclick = () => { perfil().semLogo = !perfil().semLogo; guardarPerfis(); mostrarPerfil(); };
$('pNovo').onclick = () => { const id = 'p' + Date.now(); perfis.lista.push({ id, nome: 'Nova página', arroba: '', logo: null }); perfis.atual = id; guardarPerfis(); mostrarPerfil(); $('pNome').select(); };
let confirmando = false;
$('pApagar').onclick = () => {
  if (perfis.lista.length < 2) return status('Precisa ter pelo menos um perfil.');
  if (!confirmando) { confirmando = true; $('pApagar').textContent = 'Toque de novo pra excluir'; setTimeout(() => { confirmando = false; $('pApagar').textContent = 'Excluir'; }, 3000); return; }
  perfis.lista = perfis.lista.filter((x) => x !== perfil()); perfis.atual = perfis.lista[0].id; confirmando = false; $('pApagar').textContent = 'Excluir'; guardarPerfis(); mostrarPerfil();
};
mostrarPerfil();
</script>
</body></html>
